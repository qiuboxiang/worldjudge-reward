name: repository-checks

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q infer.py render_readme_demos.py verify_outputs.py worldjudge_runtime tests
      - name: Check release layout
        run: python tests/check_repo.py
